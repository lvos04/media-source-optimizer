# Publiceer de drie getoetste MSO-images voor een nieuwe numerieke versietag.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mso
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U mso" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Controleer de tag tegen release/VERSION
        run: bash scripts/controleer-releasetag.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          echo "MSO_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: pip install -e 'apps/core[test]'
      - run: ruff check apps/core apps/mocks tests/stack
      - name: pytest
        working-directory: apps/core
        env:
          MSO_TEST_DATABASE_URL: postgresql://mso@127.0.0.1:55432/postgres
        run: python -m pytest -q -p no:warnings

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # release met bijlagen bij de bestaande tag
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Vaste S-P3-205-broncommit voor de weigerimage
      - name: Version
        id: v
        run: |
          v=$(bash scripts/controleer-releasetag.sh)
          build_time="$(date -u +%FT%TZ)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          printf '%s\n' "MSO_BUILD_VERSION=$v" "MSO_BUILD_GIT_SHA=$GITHUB_SHA" \
            "MSO_BUILD_TIME=$build_time" "MSO_BUILD_CHANNEL=release" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bouw de alles-in-één-image en de simulator
        env:
          MSO_BUILD_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          scripts/build-images.sh allinone
          docker build -t mso-mocks:stack apps/mocks
      - name: Bouw de gepinde schemaweigerimage
        run: |
          guard_image="$(tests/stack/build-schema-guard.sh)"
          printf 'MSO_SCHEMA_GUARD_IMAGE=%s\n' "$guard_image" >> "$GITHUB_ENV"
      - name: End-to-end test van de alles-in-één-image, inclusief upgrade, herstel en schemaweigering
        run: |
          python3 -m venv /tmp/aio-venv && /tmp/aio-venv/bin/pip install -q httpx==0.28.1
          # root only so the test can create a folder owned by 568 (scenario 7)
          sudo --preserve-env=MSO_BUILD_VERSION,MSO_BUILD_GIT_SHA,MSO_BUILD_TIME,MSO_BUILD_CHANNEL,MSO_SCHEMA_GUARD_IMAGE \
            /tmp/aio-venv/bin/python tests/stack/allinone_test.py media-source-optimizer:local
      - name: Bouw core voor de release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/core
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.v.outputs.build_time }}
            CHANNEL=release
          load: true
          provenance: false
          tags: ghcr.io/lvos04/media-source-optimizer-core:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/lvos04/media-source-optimizer
      - name: Bouw web voor de release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.v.outputs.build_time }}
            CHANNEL=release
          load: true
          provenance: false
          tags: ghcr.io/lvos04/media-source-optimizer-web:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/lvos04/media-source-optimizer
      - name: Installeer Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.1
      - name: Maak per release-image een SBOM
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          docker tag media-source-optimizer:local "ghcr.io/lvos04/media-source-optimizer:$MSO_BUILD_VERSION"
          for name in media-source-optimizer{,-core,-web}; do
            image="ghcr.io/lvos04/$name:$MSO_BUILD_VERSION"
            "$SYFT" scan "docker:$image" --output "spdx-json=release/$name.spdx.json"
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Controleer de Python-afhankelijkheden van de release-images
        run: |
          python -m venv "$RUNNER_TEMP/release-audit"
          "$RUNNER_TEMP/release-audit/bin/pip" install pip-audit==2.10.1
          audit_status=0
          for name in media-source-optimizer{,-core}; do
            image="ghcr.io/lvos04/$name:$MSO_BUILD_VERSION"
            requirements="$RUNNER_TEMP/$name.requirements.txt"
            # mso-core is eigen code. De geïnstalleerde runtime-afhankelijkheden blijven in de lijst staan.
            docker run --rm --pull=never --network none --entrypoint python "$image" \
              -m pip --disable-pip-version-check list --format=freeze --exclude mso-core > "$requirements"
            test -s "$requirements"
            "$RUNNER_TEMP/release-audit/bin/pip-audit" --strict --disable-pip --no-deps \
              --requirement "$requirements" --format json --output "release/$name.pip-audit.json" \
              || audit_status=$?
          done
          exit "$audit_status"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Weiger een bestaande release of imagetag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          [[ "$status" == 404 ]] || { echo "Release niet aantoonbaar vrij (HTTP $status)."; exit 1; }
          bash scripts/controleer-releasetag.sh ghcr.io/lvos04
      - name: Push de drie release-images en leg hun registerdigests vast
        shell: bash
        run: |
          digest_pairs="$RUNNER_TEMP/release-digests.tsv"
          : > "$digest_pairs"
          for name in media-source-optimizer{,-core,-web}; do
            image="ghcr.io/lvos04/$name:$MSO_BUILD_VERSION"
            docker push "$image" | tee "$RUNNER_TEMP/$name.push.log" >&2
            digest=$(awk -v tag="$MSO_BUILD_VERSION:" '$1 == tag && $2 == "digest:" {print $3}' \
              "$RUNNER_TEMP/$name.push.log")
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Geen geldige registerdigest ontvangen voor $image" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$image" "$digest" >> "$digest_pairs"
          done
          jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | from_entries' \
            < "$digest_pairs" > "$RUNNER_TEMP/digests.json"
          mv "$RUNNER_TEMP/digests.json" release/digests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.sbom.outcome == 'success'
        with:
          name: release-bewijs-${{ steps.v.outputs.version }}
          path: |
            release/digests.json
            release/*.spdx.json
            release/*.pip-audit.json
          if-no-files-found: error
      - name: Voeg digests en controles toe aan de GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Media Source Optimizer $GITHUB_REF_NAME" \
            --generate-notes release/digests.json release/*.spdx.json release/*.pip-audit.json
