# Media Source Optimizer — CI
#
# python   ruff + pinned copies (contract 1.3 and Peil 1.1.1: offline + against the source on Forgejo, scripts/bronkopie.py)
#          + pytest (unit/contract/integration incl. mocks over real HTTP, contract drift test, EVIDENCE test §11)
#          against a PostgreSQL 16 service, with pg_dump/pg_restore 16 via MSO_PG_BIN (as release.yaml)
# manifest strikte validatie van het Custom App-manifest met de gepinde gedeelde validator
# mediaguard_contract MSO-client tegen gepinde MediaGuard-core met nep-Radarr
# web      Peil drift check + typecheck + lint + unit tests (vitest) + production build of the Next.js UI
# images   docker build of core, web and mocks (alleen testbouw)
# allinone docker build of the all-in-one image (deploy/allinone, the TrueNAS Custom App) + tests/stack/allinone_test.py
#          (empty /appdata as root → healthy, processes as 568, restart/kill without data loss, backup/restore,
#          upgrade and restore with the pinned 1.3.0, 1.5.0 and 1.6.0 images, schema refusal, user 568, wrong rights); never pushed
# stack    full container stack (deploy/truenas/compose.yaml + mocks) + smoke/e2e test → tests/stack/results
# e2e      fresh stack, prepared (admin, connectors → mocks, backup, wizard completed) + ALL Playwright tests
#          (desktop + mobile) with credentials; a skipped test fails the job → screenshots/traces as artifacts
#
# De acties zijn op commit-SHA gepind.
name: ci

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mso
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mso" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MSO_TEST_DATABASE_URL: postgresql://mso@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/core/pyproject.toml
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup tests, as release.yaml)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          echo "MSO_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Install core + test extras
        run: pip install -e "apps/core[test]"
      - name: Ruff
        run: ruff check apps/core apps/mocks tests/stack scripts
      - name: Vaste digests voor Docker-basisimages
        run: python scripts/check_dockerfile_digests.py
      - name: Gepinde kopieën ongewijzigd (contract 1.3, Peil 1.1.1)
        run: python scripts/bronkopie.py controleer
      - name: Vergelijk contract en Peil met de gepinde commits en de bronbranch op Forgejo
        env:
          BRON_LEESTOKEN: ${{ secrets.BRON_LEESTOKEN }}
        run: python scripts/bronkopie.py vergelijk --online
      - name: Pytest
        working-directory: apps/core
        run: python -m pytest -q -p no:warnings --junitxml=../../test-results/pytest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pytest-results
          path: test-results/

  mediaguard_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e apps/core
      - name: Toets MSO tegen de gepinde MediaGuard-core
        env:
          TMPDIR: ${{ runner.temp }}
        run: python tests/stack/mediaguard_contract.py

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASF_COMMIT: a994c2a51f45b81b2c48c6533b0ccf51ba857f5a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lvos04/appstore-en-fork
          ref: ${{ env.ASF_COMMIT }}
          path: .appstore-validator
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Installeer de gepinde manifestvalidator
        run: |
          test "$(git -C .appstore-validator rev-parse HEAD)" = "$ASF_COMMIT"
          python -m venv "$RUNNER_TEMP/validator"
          "$RUNNER_TEMP/validator/bin/pip" install --require-hashes -r .appstore-validator/apps/api/requirements.lock
          "$RUNNER_TEMP/validator/bin/pip" install --no-deps .appstore-validator/apps/api
      - name: Valideer het Custom App-manifest strikt
        run: >-
          "$RUNNER_TEMP/validator/bin/jl-manifest" validate --strict deploy/manifest/media-source-optimizer.manifest.yaml

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Peil-kopieën ongewijzigd (versie + sha256, O-14)
        run: npm run check:peil
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test:unit
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: media-source-optimizer-core, context: apps/core}
          - {name: media-source-optimizer-web, context: apps/web}
          - {name: mso-mocks, context: apps/mocks}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Buildgegevens
        id: build
        if: matrix.name != 'mso-mocks'
        run: |
          version="$(< release/VERSION)"
          {
            echo 'args<<EOF'
            printf 'VERSION=%s\nGIT_SHA=%s\nBUILD_TIME=%s\nCHANNEL=%s\n' \
              "$version" "$GITHUB_SHA" "$(date -u +%FT%TZ)" development
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          tags: ${{ matrix.name }}:ci
          build-args: ${{ steps.build.outputs.args }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  allinone:
    # The all-in-one image is the only installation form (standard TrueNAS Custom App). Until now only release.yaml
    # tested it; this job runs the same end-to-end test on every CI run, without pushing anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Vaste S-P3-205-broncommit voor de weigerimage
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build all-in-one image + test mocks (local only, never pushed)
        run: |
          MSO_BUILD_VERSION="$(< release/VERSION)"
          # Toets canonieke API-uitvoer met Z bij een buildargument met UTC-offset en fractie.
          MSO_BUILD_TIME="$(date -u +%FT%T.%3N+00:00)"
          export MSO_BUILD_VERSION MSO_BUILD_TIME MSO_BUILD_GIT_SHA="$GITHUB_SHA" MSO_BUILD_CHANNEL=development
          printf '%s\n' "MSO_BUILD_VERSION=$MSO_BUILD_VERSION" "MSO_BUILD_GIT_SHA=$MSO_BUILD_GIT_SHA" \
            "MSO_BUILD_TIME=$MSO_BUILD_TIME" "MSO_BUILD_CHANNEL=$MSO_BUILD_CHANNEL" >> "$GITHUB_ENV"
          scripts/build-images.sh allinone
          docker build -t mso-mocks:stack apps/mocks
      - name: Bouw de gepinde schemaweigerimage
        run: |
          guard_image="$(tests/stack/build-schema-guard.sh)"
          printf 'MSO_SCHEMA_GUARD_IMAGE=%s\n' "$guard_image" >> "$GITHUB_ENV"
      - name: End-to-end test van de alles-in-één-image, inclusief upgrade, herstel en schemaweigering
        run: |
          python -m venv /tmp/aio-venv && /tmp/aio-venv/bin/pip install -q httpx==0.28.1
          # root only on the CI runner so the test can chown a folder to 568 and look inside the 0700 database folder
          # (as release.yaml); the image itself drops to 568
          sudo --preserve-env=MSO_BUILD_VERSION,MSO_BUILD_GIT_SHA,MSO_BUILD_TIME,MSO_BUILD_CHANNEL,MSO_SCHEMA_GUARD_IMAGE \
            /tmp/aio-venv/bin/python tests/stack/allinone_test.py media-source-optimizer:local
      - name: Job summary
        if: always()
        run: cat tests/stack/results/allinone-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allinone-results
          path: |
            tests/stack/results/allinone-report.md
            tests/stack/results/allinone-report.json

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [python, images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1
      - name: Unit test of the smoke log check (restart windows)
        run: python tests/stack/test_smoke_logcheck.py
      - name: Container stack smoke/e2e
        env:
          MSO_STACK_PYTHON: python
          # docker.io is reachable on GitHub runners; the mirror digest is identical
          MSO_POSTGRES_IMAGE: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        run: |
          MSO_BUILD_VERSION="$(< release/VERSION)"
          MSO_BUILD_TIME="$(date -u +%FT%TZ)"
          export MSO_BUILD_VERSION MSO_BUILD_TIME MSO_BUILD_GIT_SHA="$GITHUB_SHA" MSO_BUILD_CHANNEL=development
          tests/stack/run.sh
      - name: Job summary
        if: always()
        run: cat tests/stack/results/smoke-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stack-results
          path: tests/stack/results/

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install httpx==0.28.1
      - name: Install Playwright
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Stack + Playwright (strict — all tests must run, none skipped)
        env:
          MSO_STACK_PYTHON: python
          MSO_POSTGRES_IMAGE: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        run: |
          MSO_BUILD_VERSION="$(< release/VERSION)"
          # Toets de API-waarde en het datetime-attribuut met dezelfde UTC-offset als invoer.
          MSO_BUILD_TIME="$(date -u +%FT%T.%3N+00:00)"
          export MSO_BUILD_VERSION MSO_BUILD_TIME MSO_BUILD_GIT_SHA="$GITHUB_SHA" MSO_BUILD_CHANNEL=development
          make e2e PY=python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            apps/web/e2e/.results/
            apps/web/playwright-report/
            tests/stack/results/
