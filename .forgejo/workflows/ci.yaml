name: ci

on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MSO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: bash .forgejo/scripts/coretest-installeren.sh
      - run: ruff check apps/core apps/mocks tests/stack scripts
      - run: python scripts/check_dockerfile_digests.py
      - run: python scripts/bronkopie.py controleer
      - name: Vergelijk contract en Peil met de gepinde commits en de bronbranch op Forgejo
        env:
          BRON_LEESTOKEN: ${{ secrets.BRON_LEESTOKEN }}
        run: python scripts/bronkopie.py vergelijk --online
      - name: Pytest met PostgreSQL 16
        run: bash .forgejo/scripts/kernproef.sh --junitxml="$GITHUB_WORKSPACE/test-results/pytest.xml"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: pytest-results
          path: test-results/pytest.xml

  web:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Controleer Peil, typen, lint, unittests en de productiebuild met Node 22
        run: bash .forgejo/scripts/webproef.sh web

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [core, web, mocks]
    env:
      IMAGE: ${{ matrix.image }}
      MSO_IMAGE_TAG: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bouw de image met de herkomstgegevens
        run: |
          version=$(< release/VERSION)
          export MSO_BUILD_VERSION="$version" MSO_BUILD_GIT_SHA="$GITHUB_SHA" MSO_BUILD_CHANNEL=development
          MSO_BUILD_TIME=$(date -u +%FT%TZ)
          export MSO_BUILD_TIME
          bash scripts/build-images.sh "$IMAGE"

  mediaguard_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MSO_CONTRACT_PROJECT: mso-mg-contract-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e apps/core
      - name: Toets de MSO-client tegen de gepinde MediaGuard-core met nep-Radarr
        env:
          MSO_CONTRACT_FIXTURE_IMAGE: mso-contract-radarr:ci-${{ github.run_id }}
        run: TMPDIR="$RUNNER_TEMP" python tests/stack/mediaguard_contract.py
      - name: Eigen contractstack opruimen
        if: always()
        run: docker compose -p "$MSO_CONTRACT_PROJECT" down -v --remove-orphans

  allinone:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MSO_IMAGE_TAG: aio-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Beproef opstart, herstel, drie gepubliceerde versies en schemaweigering
        run: bash .forgejo/scripts/alles-in-een.sh
      - name: Eigen proefcontainers opruimen
        if: always()
        run: bash .forgejo/scripts/alles-in-een.sh ruim
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: allinone-results
          path: test-results/allinone/

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [python, images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install httpx==0.28.1
      - run: python tests/stack/test_smoke_logcheck.py
      - name: Draai de volledige smoketest met lokale simulatiediensten
        run: bash .forgejo/scripts/stackproef.sh stack
      - name: Eigen teststack opruimen
        if: always()
        run: docker compose -p "mso-stack-$GITHUB_RUN_ID" down -v --remove-orphans
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: stack-results
          path: |
            test-results/stack/
            !test-results/stack/**/compose.mocks.yaml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: python -m pip install httpx==0.28.1
      - name: Installeer Playwright en draai alle projecten tegen een voorbereide teststack
        run: bash .forgejo/scripts/webproef.sh e2e
      - name: Eigen teststack opruimen
        if: always()
        run: docker compose -p "mso-e2e-$GITHUB_RUN_ID" down -v --remove-orphans
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/e2e/
            apps/web/e2e/.results/
            apps/web/playwright-report/
            !test-results/e2e/**/compose.mocks.yaml
