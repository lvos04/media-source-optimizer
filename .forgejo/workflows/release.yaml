name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mso-release
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.after != '' && github.event.after != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MSO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python scripts/check_dockerfile_digests.py
      - run: bash .forgejo/scripts/coretest-installeren.sh
      - run: ruff check apps/core apps/mocks tests/stack
      - name: Pytest met PostgreSQL 16
        run: bash .forgejo/scripts/kernproef.sh

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MSO_IMAGE_TAG: release-${{ github.run_id }}
      MSO_BUILD_CHANNEL: release
      MSO_REGISTRY: git.medialeon.nl/leon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Bepaal de versie en gezamenlijke bouwtijd
        id: versie
        run: |
          versie=$(bash scripts/controleer-releasetag.sh)
          echo "nummer=$versie" >> "$GITHUB_OUTPUT"
          printf 'MSO_BUILD_VERSION=%s\nMSO_BUILD_GIT_SHA=%s\nMSO_BUILD_TIME=%s\n' \
            "$versie" "$GITHUB_SHA" "$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Bouw en beproef de alles-in-één-image met beide upgrades, herstel en schemaweigering
        run: bash .forgejo/scripts/alles-in-een.sh
      - name: Eigen proefcontainers opruimen
        if: always()
        run: bash .forgejo/scripts/alles-in-een.sh ruim
      - name: Bouw core en web met dezelfde herkomstgegevens
        run: |
          bash scripts/build-images.sh core
          bash scripts/build-images.sh web
      - name: Installeer Syft
        id: syft
        uses: https://github.com/anchore/sbom-action/download-syft@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          syft-version: v1.42.1
      - name: Maak voor elke release-image een SPDX-SBOM
        id: sbom
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p test-results/release
          for name in media-source-optimizer{,-core,-web}; do
            image="$MSO_REGISTRY/$name:$MSO_BUILD_VERSION"
            docker tag "$name:$MSO_IMAGE_TAG" "$image"
            "$SYFT" scan "docker:$image" --output "spdx-json=test-results/release/$name.spdx.json"
          done
      - name: Controleer de geïnstalleerde Python-afhankelijkheden van beide runtime-images
        run: |
          python -m venv "$RUNNER_TEMP/release-audit"
          "$RUNNER_TEMP/release-audit/bin/pip" install --no-cache-dir pip-audit==2.10.1
          audit_cache="$RUNNER_TEMP/release-audit/cache"
          install -d -m 700 "$audit_cache"
          audit_status=0
          for name in media-source-optimizer{,-core}; do
            requirements="$RUNNER_TEMP/$name.requirements.txt"
            docker run --rm --pull=never --network none --entrypoint python "$name:$MSO_IMAGE_TAG" \
              -m pip --disable-pip-version-check list --format=freeze --exclude mso-core > "$requirements"
            test -s "$requirements"
            "$RUNNER_TEMP/release-audit/bin/pip-audit" --cache-dir "$audit_cache" --strict --disable-pip --no-deps \
              --requirement "$requirements" --format json --output "test-results/release/$name.pip-audit.json" \
              || audit_status=$?
          done
          exit "$audit_status"
      - name: Meld aan bij het Forgejo-register
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: git.medialeon.nl
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Publiceer de drie getoetste images en registreer de bevestigde digests
        shell: bash
        run: |
          bash scripts/controleer-releasetag.sh "$MSO_REGISTRY"
          digest_pairs="$RUNNER_TEMP/release-digests.tsv"
          : > "$digest_pairs"
          for name in media-source-optimizer{,-core,-web}; do
            image="$MSO_REGISTRY/$name:$MSO_BUILD_VERSION"
            docker push "$image" | tee "$RUNNER_TEMP/$name.push.log"
            digest=$(awk -v tag="$MSO_BUILD_VERSION:" '$1 == tag && $2 == "digest:" {print $3}' \
              "$RUNNER_TEMP/$name.push.log")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s\t%s\n' "$image" "$digest" >> "$digest_pairs"
          done
          jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | from_entries' \
            < "$digest_pairs" | tee release/digests.json > test-results/release/digests.json
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always() && steps.sbom.outcome == 'success'
        with:
          name: release-bewijs-${{ steps.versie.outputs.nummer }}
          path: test-results/release/
          if-no-files-found: error
