name: ci

on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versie voor handmatige publicatie van core en web (leeg voor een testbouw)"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MSO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: bash .forgejo/scripts/coretest-installeren.sh
      - run: ruff check apps/core apps/mocks tests/stack scripts
      - run: python scripts/check_dockerfile_digests.py
      - run: python scripts/bronkopie.py controleer
      - name: Pytest met PostgreSQL 16
        run: bash .forgejo/scripts/kernproef.sh --junitxml="$GITHUB_WORKSPACE/test-results/pytest.xml"
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: pytest-results
          path: test-results/pytest.xml

  web:
    runs-on: docker
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:peil
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        image: [core, web, mocks]
    env:
      IMAGE: ${{ matrix.image }}
      MSO_IMAGE_TAG: ci-${{ github.run_id }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Bouw de image met de herkomstgegevens
        run: |
          version=$(< release/VERSION)
          channel=development
          if [[ -n "$RELEASE_VERSION" && "$IMAGE" != mocks ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$RELEASE_VERSION
            channel=release
          fi
          export MSO_BUILD_VERSION="$version" MSO_BUILD_GIT_SHA="$GITHUB_SHA" MSO_BUILD_CHANNEL="$channel"
          MSO_BUILD_TIME=$(date -u +%FT%TZ)
          export MSO_BUILD_TIME
          scripts/build-images.sh "$IMAGE"
      - name: Meld aan bij het Forgejo-register voor handmatige publicatie
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && matrix.image != 'mocks'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: git.medialeon.nl
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Publiceer de gevraagde versie van core of web
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && matrix.image != 'mocks'
        run: |
          image="git.medialeon.nl/leon/media-source-optimizer-$IMAGE:$RELEASE_VERSION"
          docker tag "media-source-optimizer-$IMAGE:$MSO_IMAGE_TAG" "$image"
          docker push "$image"

  mediaguard_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -e apps/core
      - name: Toets de MSO-client tegen de gepinde MediaGuard-core met nep-Radarr
        env:
          MSO_CONTRACT_FIXTURE_IMAGE: mso-contract-radarr:ci-${{ github.run_id }}
        run: TMPDIR="$RUNNER_TEMP" python tests/stack/mediaguard_contract.py

  allinone:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MSO_IMAGE_TAG: aio-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Beproef opstart, herstel, beide gepubliceerde versies en schemaweigering
        run: bash .forgejo/scripts/alles-in-een.sh
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: allinone-results
          path: test-results/allinone/

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [python, images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install httpx==0.28.1
      - run: python tests/stack/test_smoke_logcheck.py
      - name: Draai de volledige smoketest met lokale simulatiediensten
        run: bash .forgejo/scripts/stackproef.sh stack
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: stack-results
          path: |
            test-results/stack/
            !test-results/stack/**/compose.mocks.yaml

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, images]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: python -m pip install httpx==0.28.1
      - name: Installeer Playwright en Chromium
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Draai alle Playwright-projecten tegen een voorbereide teststack
        run: bash .forgejo/scripts/stackproef.sh e2e
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/e2e/
            apps/web/e2e/.results/
            apps/web/playwright-report/
            !test-results/e2e/**/compose.mocks.yaml
