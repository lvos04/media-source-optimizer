# Media Source Optimizer — CI
#
# python   ruff + pinned copies (contract 1.3 and Peil 1.1.1: offline + against the source on GitHub, scripts/bronkopie.py)
#          + pytest (unit/contract/integration incl. mocks over real HTTP, contract drift test, EVIDENCE test §11)
#          against a PostgreSQL 16 service, with pg_dump/pg_restore 16 via MSO_PG_BIN (as release.yaml)
# web      Peil drift check + typecheck + lint + unit tests (vitest) + production build of the Next.js UI
# images   docker build of core, web and mocks (pushed to ghcr.io only for release tags v*)
# stack    full container stack (deploy/truenas/compose.yaml + mocks) + smoke/e2e test → tests/stack/results
# e2e      fresh stack, prepared (admin, connectors → mocks, backup, wizard completed) + ALL Playwright tests
#          (desktop + mobile) with credentials; a skipped test fails the job → screenshots/traces as artifacts
#
# Action versions are pinned by release tag.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish core/web images to ghcr.io with this version (e.g. 1.0.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mso
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mso" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MSO_TEST_DATABASE_URL: postgresql://mso@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/core/pyproject.toml
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup tests, as release.yaml)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          echo "MSO_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Install core + test extras
        run: pip install -e "apps/core[test]"
      - name: Ruff
        run: ruff check apps/core apps/mocks tests/stack scripts
      - name: Gepinde kopieën ongewijzigd (contract 1.3, Peil 1.1.1)
        run: python scripts/bronkopie.py controleer
      - name: Gepinde kopieën tegen de bron (ai-server-manager op GitHub; Peil E08, contract 1.3 kop)
        run: python scripts/bronkopie.py vergelijk --online
      - name: Pytest
        working-directory: apps/core
        run: python -m pytest -q -p no:warnings --junitxml=../../test-results/pytest.xml
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: pytest-results
          path: test-results/

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Peil-kopieën ongewijzigd (versie + sha256, O-14)
        run: npm run check:peil
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test:unit
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: media-source-optimizer-core, context: apps/core}
          - {name: media-source-optimizer-web, context: apps/web}
          - {name: mso-mocks, context: apps/mocks}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Login to GHCR (release tags or manual release only)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') && matrix.name != 'mso-mocks'
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$RELEASE_VERSION" && "${{ matrix.name }}" != "mso-mocks" ]]; then
            [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ongeldige versie: $RELEASE_VERSION"; exit 1; }
            echo "tags=ghcr.io/lvos04/${{ matrix.name }}:${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* && "${{ matrix.name }}" != "mso-mocks" ]]; then
            echo "tags=ghcr.io/lvos04/${{ matrix.name }}:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ matrix.name }}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ steps.tags.outputs.push }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [python, images]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install httpx==0.28.1
      - name: Unit test of the smoke log check (restart windows)
        run: python tests/stack/test_smoke_logcheck.py
      - name: Container stack smoke/e2e
        env:
          MSO_STACK_PYTHON: python
          # docker.io is reachable on GitHub runners; the mirror digest is identical
          MSO_POSTGRES_IMAGE: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        run: tests/stack/run.sh
      - name: Job summary
        if: always()
        run: cat tests/stack/results/smoke-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: stack-results
          path: tests/stack/results/

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [web, images]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install httpx==0.28.1
      - name: Install Playwright
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Stack + Playwright (strict — all tests must run, none skipped)
        env:
          MSO_STACK_PYTHON: python
          MSO_POSTGRES_IMAGE: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        run: make e2e PY=python
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: playwright-results
          path: |
            apps/web/e2e/.results/
            apps/web/playwright-report/
            tests/stack/results/
