name: ci

on:
  push:
    branches: [main, "ccr-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versie voor handmatige publicatie van core en web (leeg voor een testbouw)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mso
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U mso" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MSO_TEST_DATABASE_URL: postgresql://mso@postgres:5432/postgres
      MSO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: bash .forgejo/scripts/coretest-installeren.sh
      - run: ruff check apps/core apps/mocks tests/stack scripts
      - run: python scripts/check_dockerfile_digests.py
      - run: python scripts/bronkopie.py controleer
      - name: Pytest met PostgreSQL 16
        working-directory: apps/core
        run: python -m pytest -q -p no:warnings --junitxml=../../test-results/pytest.xml
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: pytest-results
          path: test-results/pytest.xml

  bronvergelijking:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lees de bronbranch uit de herkomstgegevens
        id: bron
        run: echo "ref=$(jq -er .bron_ref docs/platform-v2/HERKOMST_CONTRACT.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: leon/ai-server-manager
          ref: ${{ steps.bron.outputs.ref }}
          fetch-depth: 0
          path: .platformbron
          token: ${{ github.token }}
          persist-credentials: false
      - name: Vergelijk contract en Peil met de gepinde commits en de bronbranch
        run: python3 scripts/bronkopie.py vergelijk --bron .platformbron

  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASF_COMMIT: a994c2a51f45b81b2c48c6533b0ccf51ba857f5a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: leon/appstore-en-fork
          ref: ${{ env.ASF_COMMIT }}
          path: .appstore-validator
          token: ${{ github.token }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Installeer de gepinde manifestvalidator
        run: |
          test "$(git -C .appstore-validator rev-parse HEAD)" = "$ASF_COMMIT"
          python -m venv "$RUNNER_TEMP/validator"
          "$RUNNER_TEMP/validator/bin/pip" install --require-hashes -r .appstore-validator/apps/api/requirements.lock
          "$RUNNER_TEMP/validator/bin/pip" install --no-deps .appstore-validator/apps/api
      - name: Valideer het Custom App-manifest strikt
        run: '"$RUNNER_TEMP/validator/bin/jl-manifest" validate --strict deploy/manifest/media-source-optimizer.manifest.yaml'

  web:
    runs-on: docker
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:peil
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
