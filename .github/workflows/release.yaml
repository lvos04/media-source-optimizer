# Release: publishes the core and web images to ghcr.io and tags the commit.
# Trigger: a push that changes release/VERSION (any branch), or a manual run.
# Images: ghcr.io/lvos04/media-source-optimizer-{core,web}:<VERSION> — exactly what deploy/truenas/compose.yaml uses.
name: release

on:
  push:
    paths: ["release/VERSION"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: mso
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U mso" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          echo "MSO_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - run: pip install -e 'apps/core[test]'
      - run: ruff check apps/core apps/mocks tests/stack
      - name: pytest
        working-directory: apps/core
        env:
          MSO_TEST_DATABASE_URL: postgresql://mso@127.0.0.1:55432/postgres
        run: python -m pytest -q -p no:warnings

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # create the v<VERSION> tag
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Version
        id: v
        run: |
          v="$(tr -d '[:space:]' < release/VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ongeldige versie in release/VERSION: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push core
        uses: docker/build-push-action@v6.18.0
        with:
          context: apps/core
          push: true
          provenance: false
          tags: ghcr.io/lvos04/media-source-optimizer-core:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/lvos04/media-source-optimizer
      - name: Build and push web
        uses: docker/build-push-action@v6.18.0
        with:
          context: apps/web
          push: true
          provenance: false
          tags: ghcr.io/lvos04/media-source-optimizer-web:${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/lvos04/media-source-optimizer
      - name: Tag release commit
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "tag $tag bestaat al"; exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
