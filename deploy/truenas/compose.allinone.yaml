# Alles-in-één-image voor lokale ontwikkeling en tests. Zie .env.example.
# Deze proef gebruikt een aparte datamap zodat zij geen data met de losse stack deelt.
services:
  media-source-optimizer:
    image: ghcr.io/lvos04/media-source-optimizer:1.6.1
    restart: unless-stopped
    ports:
      - "${MSO_WEB_PORT:-38081}:38081"
    volumes:
      - ${MSO_AIO_APPDATA:-../../var/mso-dev/allinone}:/appdata
      # optioneel, alleen-lezen, voor hardlink-/vrije-ruimtediagnose:
      # - ../../var/mso-dev/media:/media:ro
    environment:
      TZ: Europe/Amsterdam
      # MSO_MEDIA_DIR: /media
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 1536m
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
